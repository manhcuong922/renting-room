name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore renting_room.sln

      - name: Build
        run: dotnet build renting_room.sln -c Release --no-restore

      # Nhanh, không cần DB — đỏ ở đây thì dừng sớm.
      - name: Unit tests
        run: |
          for project in Domain Application Infrastructure; do
            dotnet test tests/renting_room.$project.UnitTests -c Release --no-build \
              --logger trx --results-directory TestResults
          done

      - name: Architecture tests
        run: dotnet test tests/renting_room.ArchitectureTests -c Release --no-build --logger trx --results-directory TestResults

      # PostgreSQL thật qua Testcontainers — runner ubuntu có sẵn Docker.
      - name: Integration tests
        run: dotnet test tests/renting_room.IntegrationTests -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/
            tests/renting_room.IntegrationTests/bin/Release/net10.0/openapi.actual.json
          if-no-files-found: ignore
