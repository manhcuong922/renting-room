name: CD — publish image

# Chỉ chạy khi đẩy tag phiên bản (v1.2.3) hoặc bấm tay. Không cần bí mật ngoài GITHUB_TOKEN có sẵn.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # đẩy image lên ghcr.io của chính repo này

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Không phát hành bản chưa qua test.
    uses: ./.github/workflows/ci.yml

  publish-api:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Triển khai lên máy chủ (laptop/VPS): CHƯA bật — DO-05 (scripts/deploy) chưa có và đích triển khai chưa chốt.
  # Khi có VPS: thêm job `deploy` dùng Environment "production" (cần duyệt tay) + secrets SSH_HOST, SSH_USER, SSH_KEY.
